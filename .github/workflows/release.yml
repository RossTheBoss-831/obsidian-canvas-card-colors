name: Release Obsidian plugin

# Publishes a release whenever main has a manifest.json version that
# hasn't been released yet. To ship an update: bump "version" in
# manifest.json (and add it to versions.json), then push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(jq -r .version manifest.json)
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists; nothing to do."
            exit 0
          fi
          gh release create "$v" \
            --target "$GITHUB_SHA" \
            --title "$v" \
            --generate-notes \
            main.js manifest.json styles.css
